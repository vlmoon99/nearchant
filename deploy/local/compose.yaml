# Full local stack (architecture.md §9 scenario B, m0-scope.md). `make up` starts it.
# Secrets come from the environment (see deploy/local/.env.example) — never from this file.
name: nearchant
x-app: &app
  build: { context: ../.., dockerfile: deploy/Dockerfile }
  image: nearchant/app:dev
  restart: unless-stopped
  environment: &appenv
    DATABASE_URL: postgres://nearchant:${POSTGRES_PASSWORD:-nearchant-dev}@db:5432/nearchant
    MEDIA_DIR: /app/.media
    MEDIA_PUBLIC: /media
    NEARCHANT_SECRET_KEY: ${NEARCHANT_SECRET_KEY:?set NEARCHANT_SECRET_KEY}
    NEAR_RELAYER_KEY: ${NEAR_RELAYER_KEY:-}
    NEARAI_API_KEY: ${NEARAI_API_KEY:-}
    NC_LOCAL_LLM_KEY: ${NC_LOCAL_LLM_KEY:-}
    SEARXNG_URL: ${SEARXNG_URL:-http://search:8080}
    REPLAY_DIR: ${REPLAY_DIR:-}
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
    TRUST_PROXY: ${TRUST_PROXY:-}
  volumes: ["media:/app/.media"]
  depends_on: { db: { condition: service_healthy } }

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nearchant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nearchant-dev}
      POSTGRES_DB: nearchant
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["db:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nearchant"], interval: 3s, retries: 20 }
    restart: unless-stopped

  gateway:
    <<: *app
    command: ["node", "apps/gateway/dist/main.js"]
    ports: ["${GATEWAY_BIND:-127.0.0.1}:8787:8787"]
    environment: { <<: *appenv, PORT: "8787" }

  worker:
    <<: *app
    command: ["node", "apps/worker/dist/main.js"]
    environment: { <<: *appenv, RENDERER_URL: http://renderer:8080, FACTCHECK_A2A_URL: "http://gateway:8787/h/verity/a2a/v1" }

  search:     # SearXNG for the research scouts: JSON on, limiter off, settings written at start (no mounted files)
    image: searxng/searxng@sha256:3602e6ddbeba037f5d800d1ed9d296a8b93c9f5b3cf9d05fa179d0e766dd59a1
    entrypoint:
      - sh
      - -c
      - >-
        printf 'use_default_settings: true\nserver:\n  limiter: false\n  image_proxy: false\n  secret_key: "%s"\nsearch:\n  formats: [html, json]\n'
        "$$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')" > /etc/searxng/settings.yml;
        exec /usr/local/searxng/entrypoint.sh
    restart: unless-stopped

  renderer:   # Marp CLI in server mode; sees the same media volume (docs/swarm.md render step)
    image: marpteam/marp-cli@sha256:3cf660df7b9737f875e57f7169dff0b08d1d3ab604ea2d655ab761102942fa42
    # Marp's server mode refuses a folder with no Markdown: seed a placeholder so a fresh volume works.
    entrypoint: ["sh", "-c", "[ -f _renderer.md ] || echo '# renderer' > _renderer.md; exec docker-entrypoint --server --allow-local-files ."]
    environment: { MARP_USER: "1000:1000" }
    volumes: ["media:/home/marp/app"]
    restart: unless-stopped

  tailnet:    # optional: serve the gateway on a tailnet IP. `COMPOSE_PROFILES=tailnet TAILNET_IP=100.x.y.z`
    # Binding the gateway itself to the tailnet IP fails at boot when Docker starts before Tailscale, and Docker
    # never retries a failed bind. The gateway stays on 127.0.0.1; this forwarder restarts until the IP exists.
    image: alpine/socat@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
    network_mode: host
    command: ["TCP-LISTEN:8787,bind=${TAILNET_IP:-127.0.0.2},fork,reuseaddr", "TCP:127.0.0.1:8787"]
    profiles: [tailnet]
    restart: unless-stopped

  tunnel:     # optional: public reach without opening ports (ADR 0008). `docker compose --profile tunnel up`
    image: cloudflare/cloudflared:2026.10.7
    command: ["tunnel", "--no-autoupdate", "run"]
    environment: { TUNNEL_TOKEN: "${CF_TUNNEL_TOKEN:-}" }
    profiles: [tunnel]
    restart: unless-stopped

  # `make demo`: the whole deck pipeline on recorded model answers (ADR 0013). No keys, no GPU, no chain writes.
  demo:
    image: nearchant/app:dev
    build: { context: ../.., dockerfile: deploy/Dockerfile }
    command: ["node", "apps/worker/dist/cli.js"]
    user: "${DEMO_UID:-1000}:${DEMO_GID:-1000}"   # write .media as the host user (Linux bind mounts)
    environment:
      REPLAY_DIR: /app/fixtures/replay/deck
      ORDER_ID: demo-deck
      RENDERER_URL: http://demo-renderer:8080
      MEDIA_DIR: /app/.media
    volumes: ["../../fixtures:/app/fixtures:ro", "../../.media:/app/.media"]
    depends_on: [demo-renderer]
    profiles: [demo]
  demo-renderer:
    image: marpteam/marp-cli@sha256:3cf660df7b9737f875e57f7169dff0b08d1d3ab604ea2d655ab761102942fa42
    entrypoint: ["sh", "-c", "[ -f _renderer.md ] || echo '# renderer' > _renderer.md; exec docker-entrypoint --server --allow-local-files ."]
    volumes: ["../../.media:/home/marp/app"]
    profiles: [demo]

volumes:
  db: {}
  media: {}
