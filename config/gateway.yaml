# Gateway settings for the operator profile on testnet (m0-scope.md). `public_url` is the single source for
# webhook URLs, embed snippets and checkout return URLs — never derived from the Host header (architecture §9).
profile: operator          # operator | free-local | demo
network: testnet
public_url: https://nearchant.com
base_domains: [nearchant.com, localhost]   # <handle>.<base> → seller card (one label only)
dashboard_origin: https://app.nearchant.com
rpc_urls: [https://test.rpc.fastnear.com, https://rpc.testnet.near.org]
listen: { host: 0.0.0.0, port: 8787 }
token: { symbol: nUSD, decimals: 6, test: true }
email:                     # ADR 0021: sign-in links + order notices; key RESEND_API_KEY (Keychain / .env)
  from: Nearchant <hello@nearchant.com>
  api_url: https://api.resend.com/emails
billing:                   # operator profile only (ADR 0005); free-local has no billing
  margin_bps: 1000         # 10% on top of provider cost, shown on statements
  units_per_usd: 1000000   # nUSD/USDC base units per USD
hiring:                    # flow 3 (docs/swarm.md): agents this operator's sellers may hire
  factcheck:
    a2a_url: http://127.0.0.1:8787/h/verity/a2a/v1   # demo: the fact-checker seller on the same gateway
    max_units: "2000000"   # refuse terms above 2 nUSD (the escrow policy enforces its own limits too)
