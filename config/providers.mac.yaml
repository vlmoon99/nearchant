# Mac fallback while the Sparks are offline (owner, 1 Nov): text + vision on NEAR AI TEE models, images on
# Comfy Cloud through our image service (deploy/image-engine/service, IMAGE_BACKEND=comfy_cloud).
# Select with PROVIDERS_FILE=providers.mac.yaml. NEAR AI credit is small: a credit error stops the job.
endpoints:
  - id: nearai
    base_url: https://cloud-api.near.ai/v1
    api_key_env: NEARAI_API_KEY
    privacy_tier: tee
    attestation: nearai
    capabilities: [chat, vision]
    timeout_ms: 180000

  - id: cloud-image                      # Comfy Cloud via our image service; product photos for public posts only
    base_url: http://image:8102/v1
    api_key_env: IMAGE_API_KEY
    privacy_tier: public
    capabilities: [image.generate]
    timeout_ms: 300000

routing:
  chat: [nearai]
  vision: [nearai]
  image.generate: [cloud-image]
  private_data_allowed_tiers: [tee]

models:
  chat: [Qwen/Qwen3.6-35B-A3B-FP8]
  vision: [Qwen/Qwen3.6-35B-A3B-FP8]
  image.generate: [qwen-image-edit]

prices: {}
