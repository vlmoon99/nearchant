    label: Qwen-Image-Edit 2511 · Lightning 4 steps (current default)
    workflow: qwen_edit.json
    needs_photo: true
  - id: qie2511-l8
    label: Qwen-Image-Edit 2511 · Lightning 8 steps
    workflow: qwen_edit.json
    needs_photo: true
    set: { "29.lora_name": Qwen-Image-Edit-2511-Lightning-8steps-V1.0-fp32.safetensors, "31.steps": 8 }
