# Image lab (admin only, tailnet): models to compare on Comfy Cloud before choosing the production default.
# Each variant = a workflow file in config/image-lab/ + node overrides "<nodeId>.<input>": value.
# Placeholders in workflows: __PROMPT__, __REF__ (uploaded photo), __SEED__, __WIDTH__, __HEIGHT__.
variants:
