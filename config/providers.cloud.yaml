# Cloud-only model routing for a gateway that can't reach the owner's GPUs (Phala CVM, ADR 0007):
# everything on NEAR AI Cloud TEE models. Select with PROVIDERS_FILE=providers.cloud.yaml.
endpoints:
  - id: nearai
    base_url: https://cloud-api.near.ai/v1
    api_key_env: NEARAI_API_KEY
    privacy_tier: tee
    attestation: nearai
    capabilities: [chat, vision, embed, rerank, image.generate, image.edit, asr]
    timeout_ms: 180000

routing:
  chat: [nearai]
  vision: [nearai]
  embed: [nearai]
  rerank: [nearai]
  image.generate: [nearai]
  image.edit: [nearai]
  asr: [nearai]
  private_data_allowed_tiers: [tee]

models:
  chat: [Qwen/Qwen3.6-35B-A3B-FP8]
  vision: [Qwen/Qwen3.6-35B-A3B-FP8]
  embed: [Qwen/Qwen3-Embedding-0.6B]
  rerank: [Qwen/Qwen3-Reranker-0.6B]
  image.generate: [black-forest-labs/FLUX.2-klein-4B]
  image.edit: [black-forest-labs/FLUX.2-klein-4B]
  asr: [openai/whisper-large-v3]

prices: {}
