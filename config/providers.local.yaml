# Development routing: the owner's own GPU for every model; only the tiny Levanto Sage caption check goes to NEAR AI.
# Select with PROVIDERS_FILE=providers.local.yaml. Second-seat requests for NEAR AI models find no endpoint
# and fall back to the main seat (packages/swarm/src/agent.ts). Pictures and video run on Comfy Cloud only (owner,
# 2 Nov): the image service in cloud mode answers at http://image:8102; the Sparks keep the LLMs.
endpoints:
  - id: spark-8695                       # Nearchant's own node (gx10-8695), vLLM, Qwen3.6 (text + vision)
    base_url: http://100.64.0.13:8010/v1
    api_key_env: NC_LOCAL_LLM_KEY
    privacy_tier: local
    capabilities: [chat, vision]
    model_map:
      Qwen/Qwen3.6-35B-A3B-FP8: qwen3.6-35b-a3b
    extra_body:
      chat_template_kwargs: { enable_thinking: false }
    timeout_ms: 180000

  - id: spark-c3c8                       # Nearchant's second node (gx10-c3c8), vLLM 0.31, Qwen3.8-27B (deploy/llm-node)
    base_url: http://100.64.0.1:8010/v1
    api_key_env: NC_LOCAL_LLM_KEY
    privacy_tier: local
    capabilities: [chat, vision]
    model_map:
      Qwen/Qwen3.8-27B: qwen3.8-27b
    extra_body:
      chat_template_kwargs: { enable_thinking: false }
    timeout_ms: 300000                   # ~23 tok/s: a 3-post batch is a few thousand tokens

  - id: spark-image                      # image service in Comfy Cloud mode (compose profile cloudimage), Qwen-Image-Edit-2511
    base_url: http://image:8102/v1       # pass image_b64 (product photo) to restyle it; none = paint from text
    api_key_env: IMAGE_API_KEY
    privacy_tier: public   # Comfy Cloud: only pictures for posts that will be published (public data)
    capabilities: [image.generate]
    timeout_ms: 240000

  - id: nearai-sage                     # Levanto Sage on NEAR AI: yes/no checks of captions (public data only)
    base_url: https://cloud-api.near.ai/v1
    api_key_env: NEARAI_API_KEY
    privacy_tier: tee
    attestation: nearai
    capabilities: [decide]
    timeout_ms: 30000

routing:
  decide: [nearai-sage]
  chat: [spark-8695, spark-c3c8]
  image.generate: [spark-image]
  vision: [spark-8695, spark-c3c8]
  private_data_allowed_tiers: [local]

models:
  decide: [levanto/sage-1.4]
  chat: [Qwen/Qwen3.6-35B-A3B-FP8]
  vision: [Qwen/Qwen3.6-35B-A3B-FP8]
  image.generate: [qwen-image-edit]

prices: {}
