# Development routing: the owner's own GPU only, so building and testing spends no NEAR AI credit.
# Select with PROVIDERS_FILE=providers.local.yaml. Second-seat requests for NEAR AI models find no endpoint
# and fall back to the main seat (packages/swarm/src/agent.ts). Images go to our own ComfyUI (spark-image).
endpoints:
  - id: spark-8695                       # Nearchant's own node (gx10-8695), vLLM, Qwen3.6 (text + vision)
    base_url: http://100.64.0.13:8010/v1
    api_key_env: NC_LOCAL_LLM_KEY
    privacy_tier: local
    capabilities: [chat, vision]
    model_map:
      Qwen/Qwen3.6-35B-A3B-FP8: qwen3.6-35b-a3b
    extra_body:
      chat_template_kwargs: { enable_thinking: false }
    timeout_ms: 180000

  - id: spark-image                      # our ComfyUI on gx10-8695 (compose profile gpu), Qwen-Image-Edit-2511
    base_url: http://image:8102/v1       # pass image_b64 (product photo) to restyle it; none = paint from text
    api_key_env: IMAGE_API_KEY
    privacy_tier: local
    capabilities: [image.generate]
    timeout_ms: 240000

routing:
  chat: [spark-8695]
  image.generate: [spark-image]
  vision: [spark-8695]
  private_data_allowed_tiers: [local]

models:
  chat: [Qwen/Qwen3.6-35B-A3B-FP8]
  vision: [Qwen/Qwen3.6-35B-A3B-FP8]
  image.generate: [qwen-image-edit]

prices: {}
