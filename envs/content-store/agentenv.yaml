spec: nearchant.com/spec/agentenv/v1
name: content-store
version: 0.1.0
license: MIT
description: AI content manager for a small store — learns the business from its photos, finds ways to sell more, writes posts, learns the owner's taste, explains the numbers. Prompts ported from Boost Content (profile p2, ideas i4, learn k1, localize l1).
requires:
  capabilities:
    vision: { min_context: 24000 }
    chat: { tool_calling: false }
    image.generate: { optional: true }
  data_class: private
seats:
  main: {}                                   # router default (Qwen3.6-35B-A3B on gx10-8695; NEAR AI on the Mac)
  second: { model: Qwen/Qwen3.8-27B }        # the writing roles (gx10-c3c8); unreachable → the main seat answers
roles: [profiler, opportunity-analyst, idea-writer, localizer, learner, insight-writer, video-director, caption-editor, moderator, search-planner, place-finder, store-assistant]
pipeline: [analyze, opportunities, ideas, render, publish]
research:
  scouts: []
policy: { publish: require_approval, payments: escrow_only }
